<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dış Siyah Çerçeve -->
  <rect x="2" y="2" width="60" height="60" rx="8" fill="#111827" />
  
  <!-- 4 Politik Pusula Çeyreği -->
  <!-- Sol Üst: Kırmızı (Auth-Left) -->
  <rect x="6" y="6" width="25" height="25" rx="3" fill="#fca5a5" />
  <!-- Sağ Üst: Mavi (Auth-Right) -->
  <rect x="33" y="6" width="25" height="25" rx="3" fill="#93c5fd" />
  <!-- Sol Alt: Yeşil (Lib-Left) -->
  <rect x="6" y="33" width="25" height="25" rx="3" fill="#86efac" />
  <!-- Sağ Alt: Sarı (Lib-Right) -->
  <rect x="33" y="33" width="25" height="25" rx="3" fill="#fde047" />

  <!-- Eksen Çizgileri -->
  <line x1="32" y1="5" x2="32" y2="59" stroke="#111827" stroke-width="2" />
  <line x1="5" y1="32" x2="59" y2="32" stroke="#111827" stroke-width="2" />

  <!-- Merkez Pusula Göstergesi -->
  <circle cx="32" cy="32" r="3.5" fill="#111827" />
  <circle cx="32" cy="32" r="1.5" fill="#ffffff" />
</svg>
